<svg viewBox="0 0 1200 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39ff88" stop-opacity="0"/>
      <stop offset="12%" stop-color="#39ff88" stop-opacity="0.9"/>
      <stop offset="88%" stop-color="#39ff88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#39ff88" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="70" fill="#05070a"/>

  <!-- graticule -->
  <g stroke="#1a2b22" stroke-width="1">
    <line x1="0" y1="14" x2="1200" y2="14"/>
    <line x1="0" y1="35" x2="1200" y2="35"/>
    <line x1="0" y1="56" x2="1200" y2="56"/>
    <line x1="100" y1="0" x2="100" y2="70"/>
    <line x1="300" y1="0" x2="300" y2="70"/>
    <line x1="500" y1="0" x2="500" y2="70"/>
    <line x1="700" y1="0" x2="700" y2="70"/>
    <line x1="900" y1="0" x2="900" y2="70"/>
    <line x1="1100" y1="0" x2="1100" y2="70"/>
  </g>

  <!-- clock / square wave morphing into sine, left half digital right half analog -->
  <path d="M0,35 L80,35 L80,14 L160,14 L160,56 L240,56 L240,14 L320,14 L320,56 L400,56 L400,35
           C 440,35 460,14 500,14 C 540,14 560,56 600,56
           C 640,56 660,14 700,14 C 740,14 760,56 800,56
           C 840,56 860,14 900,14 C 940,14 960,56 1000,56 L1200,35"
        fill="none" stroke="url(#fade)" stroke-width="2"/>

  <!-- via dots along the trace -->
  <g fill="#39ff88">
    <circle cx="160" cy="14" r="2"/>
    <circle cx="240" cy="56" r="2"/>
    <circle cx="320" cy="14" r="2"/>
    <circle cx="500" cy="14" r="2"/>
    <circle cx="700" cy="14" r="2"/>
    <circle cx="900" cy="14" r="2"/>
  </g>
</svg>

<svg viewBox="0 0 1200 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="pad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a8"/>
      <stop offset="100%" stop-color="#d9a06b"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="90" fill="url(#bg)"/>

  <!-- die outline -->
  <rect x="520" y="20" width="160" height="50" rx="3" fill="none" stroke="#00e5ff" stroke-width="1.2" opacity="0.85"/>
  <rect x="534" y="34" width="132" height="22" rx="1" fill="#00e5ff" opacity="0.08"/>

  <!-- bond pads on die -->
  <g fill="url(#pad)">
    <circle cx="534" cy="30" r="2.6"/>
    <circle cx="560" cy="30" r="2.6"/>
    <circle cx="586" cy="30" r="2.6"/>
    <circle cx="612" cy="30" r="2.6"/>
    <circle cx="638" cy="30" r="2.6"/>
    <circle cx="664" cy="30" r="2.6"/>
    <circle cx="534" cy="60" r="2.6"/>
    <circle cx="560" cy="60" r="2.6"/>
    <circle cx="586" cy="60" r="2.6"/>
    <circle cx="612" cy="60" r="2.6"/>
    <circle cx="638" cy="60" r="2.6"/>
    <circle cx="664" cy="60" r="2.6"/>
  </g>

  <!-- traces fanning out left -->
  <g stroke="url(#trace)" stroke-width="1" fill="none" opacity="0.8">
    <path d="M520,30 L440,30 L360,14 L60,14"/>
    <path d="M520,38 L460,38 L400,26 L60,26"/>
    <path d="M520,52 L460,52 L400,64 L60,64"/>
    <path d="M520,60 L440,60 L360,76 L60,76"/>
  </g>

  <!-- traces fanning out right -->
  <g stroke="url(#trace)" stroke-width="1" fill="none" opacity="0.8">
    <path d="M680,30 L760,30 L840,14 L1140,14"/>
    <path d="M680,38 L740,38 L800,26 L1140,26"/>
    <path d="M680,52 L740,52 L800,64 L1140,64"/>
    <path d="M680,60 L760,60 L840,76 L1140,76"/>
  </g>

  <!-- via dots along traces -->
  <g fill="#00e5ff">
    <circle cx="360" cy="14" r="1.6"/>
    <circle cx="400" cy="26" r="1.6"/>
    <circle cx="400" cy="64" r="1.6"/>
    <circle cx="360" cy="76" r="1.6"/>
    <circle cx="840" cy="14" r="1.6"/>
    <circle cx="800" cy="26" r="1.6"/>
    <circle cx="800" cy="64" r="1.6"/>
    <circle cx="840" cy="76" r="1.6"/>
  </g>
</svg>
